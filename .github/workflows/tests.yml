name: tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  phpunit:
    name: phpunit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, fileinfo, dom
          coverage: none

      - run: composer update --no-interaction --prefer-dist --no-progress

      - run: composer test
        env:
          APP_ENV: testing

  mysql-concurrency:
    name: mysql concurrency (PHP 8.4 / MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: concurrency-test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pconcurrency-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, fileinfo, dom
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit tests/Integration/MySqlConcurrencyTest.php tests/Integration/MySqlInstallBaselineTest.php
        env:
          ACCOUNTING_TEST_MYSQL: '1'
          ACCOUNTING_TEST_MYSQL_PASSWORD: concurrency-test

  pint:
    name: pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer format -- --verbose

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer analyse

  composer-validate:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict --no-check-publish --no-check-lock
